version: 2.1

commands:
  verify-and-test:
    steps:
      - run:
          name: Verify Swift and MySQL client
          command: |
            swift --version
            swift --version | grep -E 'Swift version 6\.4\.1([[:space:]]|$)'
            pkg-config --cflags --libs mysqlclient
      - run:
          name: Wait for MySQL and prepare test database
          command: |
            deadline=$((SECONDS + 120))
            until mysql --protocol=TCP --host=127.0.0.1 --user=root --connect-timeout=2 -e 'SELECT 1'; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "MySQL did not become ready within 120 seconds" >&2
                exit 1
              fi
              sleep 2
            done
            mysql --protocol=TCP --host=127.0.0.1 --user=root -e 'CREATE DATABASE IF NOT EXISTS test; SELECT VERSION();'
      - run: swift build
      - run: swift test

jobs:
  mac-swift6-4-1-mysql8-4:
    macos:
      xcode: "27.0.0"
    steps:
      - checkout
      - run:
          name: Install Swift 6.4.1
          command: |
            curl --fail --location https://download.swift.org/swiftly/darwin/swiftly.pkg --output /tmp/swiftly.pkg
            installer -pkg /tmp/swiftly.pkg -target CurrentUserHomeDirectory
            "$HOME/.swiftly/bin/swiftly" init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
            . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
            swiftly install 6.4.1 --assume-yes
            swiftly use 6.4.1 --global-default --assume-yes
            echo '. "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"' >> "$BASH_ENV"
      - run:
          name: Install and start MySQL 8.4
          command: |
            brew install pkg-config mysql@8.4
            mysql_prefix="$(brew --prefix mysql@8.4)"
            printf 'export PATH="%s/bin:$PATH"\n' "$mysql_prefix" >> "$BASH_ENV"
            printf 'export PKG_CONFIG_PATH="%s/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"\n' "$mysql_prefix" >> "$BASH_ENV"
            brew services start mysql@8.4
      - verify-and-test

  linux-swift6-4-1-mysql8-4:
    docker:
      - image: swift:6.4.1-noble
      - image: mysql:8.4
        environment:
          MYSQL_DATABASE: "test"
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
    steps:
      - checkout
      - run:
          name: Install MySQL client and development libraries
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libmysqlclient-dev mysql-client
      - verify-and-test

workflows:
  build_and_test:
    jobs:
      - mac-swift6-4-1-mysql8-4
      - linux-swift6-4-1-mysql8-4
